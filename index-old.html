<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blow Your Candle</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <section class="blow-section">

        <div class="container text-center">

            <h1 id="title">
                Blow Your <span>Candle</span>
            </h1>

            <p id="subtitle">
                Close your eyes, make a wish and blow the candle.
            </p>

            <button id="wishBtn" class="btn btn-danger px-4 py-2">
                ❤️ Make A Wish
            </button>

            <div class="scene">

                <img src="img/cake.png" class="cake" id="cake" alt="Birthday Cake">

                <div class="girl-box">

                    <img src="img/girl.png" class="girl" id="girl" alt="Girl">

                </div>

                <div class="candle">

                    <div id="flame"></div>

                    <div id="smoke"></div>

                </div>

            </div>

        </div>

    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="js/script.js"></script>

</body>

</html>
