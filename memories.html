<!DOCTYPE html>
<html lang="en">

<title>Tanu Memory Gallery ❤️</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#fff;
}

.header{
    text-align:center;
    padding:40px 20px;
}

.header h1{
    font-size:50px;
    color:#ff4f9a;
}

.header p{
    font-size:20px;
    color:#666;
    margin-top:10px;
}

/* Masonry Gallery */
.gallery{
    width:90%;
    max-width:1300px;
    margin:auto;
    column-count:4;
    column-gap:15px;
    padding-bottom:50px;
}

.gallery img{
    width:100%;
    margin-bottom:15px;
    border-radius:18px;
    display:block;
    break-inside:avoid;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    transition:0.3s;
    cursor:pointer;
}

.gallery img:hover{
    transform:scale(1.03);
}

/* Mobile Responsive */
@media(max-width:992px){
    .gallery{
        column-count:3;
    }
}

@media(max-width:768px){
    .gallery{
        column-count:2;
    }

    .header h1{
        font-size:35px;
    }
}

@media(max-width:480px){
    .gallery{
        column-count:1;
    }

    .header h1{
        font-size:28px;
    }
}

/* Popup */
.popup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.popup img{
    max-width:90%;
    max-height:90vh;
    border-radius:15px;
}

.close{
    position:absolute;
    top:20px;
    right:30px;
    color:white;
    font-size:40px;
    cursor:pointer;
}
</style>
</head>
